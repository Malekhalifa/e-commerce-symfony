<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="TechStore: a shopping bag holding a tech product">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14a38b"/>
      <stop offset="1" stop-color="#0b3d3a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- bag handle -->
  <path d="M48 44 V38 a16 16 0 0 1 32 0 V44" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- bag body -->
  <path d="M30 46 H98 L94 100 a8 8 0 0 1 -8 7.4 H42 a8 8 0 0 1 -8 -7.4 Z" fill="#ffffff"/>
  <!-- the product: code brackets, as in the store logo -->
  <path d="M57 64 L46 76 L57 88 M71 64 L82 76 L71 88" fill="none" stroke="#14a38b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- price tag -->
  <circle cx="98" cy="30" r="10" fill="#ffb84d"/>
  <circle cx="98" cy="30" r="3" fill="#0b3d3a"/>
</svg>
